# Полное обновление сайта: все турниры и составы с BO3.GG, конфиги и прицелы CS2.
# Делается раз в час — оно долгое (несколько минут), поэтому вынесено из быстрого запуска
# в отдельный рабочий процесс и не перекрывает обновления текущих матчей каждые 15 минут.
name: Обновление сайта (полное)

on:
  schedule:
    - cron: '7 * * * *'   # раз в час в :07 — со сдвигом от быстрых запусков (:00, :15, :30, :45)
  workflow_dispatch:
    inputs:
      full:
        description: 'Полная синхронизация прямо сейчас'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

# Та же очередь, что и у быстрого обновления: публикации не накладываются друг на друга.
concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - id: pages
        uses: actions/configure-pages@v5

      # Обе публикации восстанавливают один и тот же последний опубликованный набор.
      # Ошибка загрузки останавливает публикацию, а не возвращает старые файлы из Git.
      - name: Сохранить опубликованные конфиги, прицелы и картинки
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/preserve-cs2.py restore --base-url "$SITE_URL"

      # Берём базу с уже опубликованного сайта — так сохраняются история матчей и составы
      - name: Скачать текущую базу
        run: |
          mkdir -p data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/esports.db?t=$(date +%s)" -o data/esports.db \
            && echo "База скачана: $(du -h data/esports.db | cut -f1)" \
            || { rm -f data/esports.db; echo "Опубликованной базы ещё нет — начинаем с нуля"; }

      - name: Забрать свежие данные с BO3.GG (полная синхронизация)
        timeout-minutes: 18
        env:
          # по расписанию всегда полная; вручную можно снять галочку и получить быстрый обход
          FORCE_FULL: ${{ inputs.full || github.event_name == 'schedule' }}
        run: node scripts/update-data.js

      - name: Обновить конфиги и прицелы CS2
        timeout-minutes: 12
        run: node scripts/update-cs2-content.js

      - name: Сохранить набор CS2 для следующих обновлений
        run: python3 scripts/preserve-cs2.py pack

      - name: Собрать файлы сайта
        run: |
          mkdir -p _site/data
          cp index.html favicon.svg _site/
          cp -r assets _site/
          cp data/esports.db data/cs2-content.tar.gz _site/data/
          touch _site/.nojekyll

      # Отдельные HTML-страницы с метатегами для поисковиков + sitemap.xml, robots.txt, 404.html и проверка SEO
      - name: Предгенерация страниц и проверка SEO
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/prerender.js _site
          node scripts/seo-check.js _site/seo-report.json --no-fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
