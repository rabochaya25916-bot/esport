# Сайт без сервера: GitHub сам обновляет данные и публикует сайт на GitHub Pages.
# Это БЫСТРОЕ обновление: только текущие матчи и результаты, каждые ~15 минут.
# Полная синхронизация (все турниры, составы, конфиги и прицелы) — в update-site-full.yml раз в час.
# Ничего запускать не нужно — достаточно один раз включить Pages (см. README, раздел «Сайт без сервера»).
name: Обновление сайта (быстро)

on:
  schedule:
    - cron: '*/15 * * * *'   # каждые ~15 минут (GitHub может задерживать запуск на несколько минут)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Быстрая и полная синхронизации берут одну и ту же базу и публикуют её, поэтому не работают
# одновременно: второй запуск просто ждёт, пока первый опубликуется, и ничего не теряется.
concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - id: pages
        uses: actions/configure-pages@v5

      # Берём базу с уже опубликованного сайта — так сохраняются история матчей и составы
      - name: Скачать текущую базу
        run: |
          mkdir -p data
          curl -fsSL "${{ steps.pages.outputs.base_url }}/data/esports.db?t=$(date +%s)" -o data/esports.db \
            && echo "База скачана: $(du -h data/esports.db | cut -f1)" \
            || { rm -f data/esports.db; echo "Опубликованной базы ещё нет — начинаем с нуля"; }

      # Только текущие матчи: быстрый обход, который успевает опубликоваться за минуту
      - name: Забрать свежие данные с BO3.GG (текущие матчи)
        timeout-minutes: 10
        env:
          FORCE_FULL: 'false'
          FULL_EVERY_MIN: '100000'   # никогда не переходить к полной синхронизации — для неё есть отдельный запуск
        run: node scripts/update-data.js

      # Трансляции не требуют ключей: сайт подключает официальный плеер Twitch напрямую по выбору пользователя.

      - name: Собрать файлы сайта
        run: |
          mkdir -p _site/data
          cp index.html favicon.svg _site/
          cp -r assets _site/
          cp data/esports.db _site/data/
          touch _site/.nojekyll

      # Отдельные HTML-страницы с метатегами для поисковиков + sitemap.xml, robots.txt, 404.html и проверка SEO
      - name: Предгенерация страниц и проверка SEO
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node scripts/prerender.js _site
          node scripts/seo-check.js _site/seo-report.json --no-fail

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
